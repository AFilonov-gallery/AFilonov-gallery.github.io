name: Make thumbnails

"on":
  push:
    paths:
      - "photos/**"
      - "make_thumbs.py"
      - "!photos/small/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Устанавливаем Pillow
        run: pip install pillow

      - name: Ужимаем фото
        run: python make_thumbs.py

      - name: Коммитим миниатюры
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/small
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "Add thumbnails [skip ci]"
            git push
          fi
